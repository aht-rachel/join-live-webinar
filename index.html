
<script>
    const START_HOUR = 13, START_MIN = 45;  // 1:45 PM ET
    const END_HOUR = 20, END_MIN = 40;      // 8:40 PM ET
    const JOIN_LINK = 'https://live.travelaht.com/aht';
    const RESERVE_LINK = 'https://aht-rachel.github.io/reserve-spot/';

    function getETNow() {
        const now = new Date();
        return new Date(now.toLocaleString("en-US", {
            timeZone: "America/New_York"
        }));
    }

    function isLive() {
        const et = getETNow();
        const mins = et.getHours() * 60 + et.getMinutes();
        const start = START_HOUR * 60 + START_MIN;
        const end = END_HOUR * 60 + END_MIN;
        return mins >= start && mins <= end;
    }

    function formatTime(h, m) {
        const ampm = h >= 12 ? 'PM' : 'AM';
        const hh = h % 12 || 12;
        const mm = m.toString().padStart(2, '0');
        return `${hh}:${mm} ${ampm}`;
    }

    function pad2(n) {
        return n.toString().padStart(2, '0');
    }

    function renderClock(h, m, s) {
        return `<div class="flip-clock">
            <div class="flip-unit">
                <div class="num">${pad2(h)}</div>
                <div class="lbl">Hrs</div>
            </div>
            <div class="flip-unit">
                <div class="num">${pad2(m)}</div>
                <div class="lbl">Min</div>
            </div>
            <div class="flip-unit">
                <div class="num">${pad2(s)}</div>
                <div class="lbl">Sec</div>
            </div>
        </div>`;
    }

    function updateUI() {
        const btn = document.getElementById('joinBtn');
        const badge = document.getElementById('liveBadge');
        const countdown = document.getElementById('countdown');
        const sbtn = document.getElementById('stickyBtn');
        const scount = document.getElementById('stickyCount');
        const rbtn = document.getElementById('reserveBtn');
        const rmsg = document.getElementById('reserveMsg');
        const timeStr = formatTime(START_HOUR, START_MIN);

        /*
         * RESERVE YOUR SPOT
         * Always active, regardless of presentation hours.
         */
        rbtn.classList.remove('inactive');
        rbtn.classList.add('active');
        rbtn.setAttribute('href', RESERVE_LINK);
        rbtn.setAttribute('target', '_blank');
        rbtn.setAttribute('rel', 'noopener');
        rbtn.style.pointerEvents = 'auto';
        rbtn.style.opacity = '1';
        rbtn.removeAttribute('aria-disabled');

        if (isLive()) {
            // LIVE PRESENTATION: enable Zoom joining
            btn.classList.remove('inactive');
            btn.classList.add('active');
            btn.setAttribute('href', JOIN_LINK);
            btn.textContent = 'JOIN NOW — WE ARE LIVE';

            badge.style.display = 'inline-flex';
            countdown.innerHTML = '';

            sbtn.classList.add('active');
            sbtn.textContent = 'JOIN NOW — WE ARE LIVE';
            sbtn.setAttribute('href', JOIN_LINK);
            scount.textContent = '';

            rmsg.innerHTML =
                'We&rsquo;re live right now! Join the presentation above, ' +
                'or reserve a spot for an upcoming session below.';

        } else {
            // OFFLINE: disable Zoom joining, but keep reservations available
            btn.classList.remove('active');
            btn.classList.add('inactive');
            btn.textContent = 'JOIN NOW';
            btn.removeAttribute('href');

            badge.style.display = 'none';

            sbtn.classList.remove('active');
            sbtn.removeAttribute('href');

            rmsg.innerHTML =
                'We&rsquo;re not live at the moment.<br>' +
                '<strong>Reserve your spot anytime for an upcoming session!</strong>';

            const et = getETNow();
            const nowSec =
                et.getHours() * 3600 +
                et.getMinutes() * 60 +
                et.getSeconds();

            const startSec =
                START_HOUR * 3600 + START_MIN * 60;

            if (nowSec < startSec) {
                const diff = startSec - nowSec;
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff % 3600) / 60);
                const s = diff % 60;

                countdown.innerHTML =
                    `<div class="cd-caption">Button activates at ` +
                    `<span>${timeStr} ET</span></div>` +
                    renderClock(h, m, s);

                sbtn.textContent = 'Not live yet';

                scount.textContent =
                    `Button activates at ${timeStr} ET ` +
                    `(${h > 0 ? h + 'h ' : ''}${m}m)`;

            } else {
                countdown.innerHTML =
                    `<div class="cd-caption">We are offline. ` +
                    `Next session starts at <span>${timeStr} ET</span> tomorrow.</div>`;

                sbtn.textContent = 'Currently offline';
                scount.textContent =
                    `Next session: ${timeStr} ET tomorrow`;
            }
        }
    }

    function showUserLocalTime() {
        const el = document.getElementById('yourTime');

        // Build today's scheduled times in Eastern Time.
        const now = new Date();

        const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            year: 'numeric',
            month: 'numeric',
            day: 'numeric'
        }).formatToParts(now);

        const getPart = type =>
            Number(parts.find(part => part.type === type).value);

        const year = getPart('year');
        const month = getPart('month') - 1;
        const day = getPart('day');

        function easternTimeToLocal(hour, minute) {
            // Start with the target Eastern wall-clock time.
            const target = new Date(
                Date.UTC(year, month, day, hour, minute)
            );

            // Determine the Eastern UTC offset for this date/time.
            const easternString = target.toLocaleString('en-US', {
                timeZone: 'America/New_York'
            });

            const easternDate = new Date(easternString);
            const offset = target.getTime() - easternDate.getTime();

            // Convert the intended Eastern time to an absolute instant.
            return new Date(target.getTime() + offset);
        }

        const localStart = easternTimeToLocal(14, 0);
        const localEnd = easternTimeToLocal(20, 30);

        el.innerHTML =
            `<strong>Your local time:</strong> ` +
            `${localStart.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                timeZoneName: 'short'
            })} — ` +
            `${localEnd.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
            })}`;
    }

    updateUI();
    showUserLocalTime();

    // Refresh the live-session status every second.
    setInterval(updateUI, 1000);

    // ===== Join choice modal =====
    const modal = document.getElementById('joinModal');
    const choiceView = document.getElementById('choiceView');
    const wideView = document.getElementById('wideView');

    function openModal() {
        choiceView.style.display = 'block';
        wideView.style.display = 'none';
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('joinBtn').addEventListener('click', function(e) {
        if (isLive()) {
            e.preventDefault();
            openModal();
        }
    });

    document.getElementById('stickyBtn').addEventListener('click', function(e) {
        if (isLive()) {
            e.preventDefault();
            openModal();
        }
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);

    modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    document.getElementById('wideChoice').addEventListener('click', function() {
        choiceView.style.display = 'none';
        wideView.style.display = 'block';
    });

    document.getElementById('wideBack').addEventListener('click', function() {
        wideView.style.display = 'none';
        choiceView.style.display = 'block';
    });

    // Tap-to-copy the Zoom URL.
    const copyUrl = document.getElementById('copyUrl');

    copyUrl.addEventListener('click', function() {
        const done = function() {
            copyUrl.textContent = 'Copied! ✓';
            copyUrl.classList.add('copied');

            setTimeout(function() {
                copyUrl.textContent = 'live.travelaht.com/aht';
                copyUrl.classList.remove('copied');
            }, 1600);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText('https://live.travelaht.com/aht')
                .then(done)
                .catch(done);
        } else {
            done();
        }
    });
</script>
